<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Goldsmiths Site Builder">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D67B"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6B12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#plate)"/>
  <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.65"/>
  <!-- browser window -->
  <rect x="96" y="128" width="320" height="232" rx="20" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <line x1="96" y1="180" x2="416" y2="180" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="132" cy="154" r="10" fill="url(#gold)"/>
  <circle cx="168" cy="154" r="10" fill="url(#gold)"/>
  <circle cx="204" cy="154" r="10" fill="url(#gold)"/>
  <!-- content blocks -->
  <rect x="128" y="208" width="120" height="18" rx="9" fill="url(#gold)"/>
  <rect x="128" y="242" width="256" height="12" rx="6" fill="#C9A227" opacity="0.55"/>
  <rect x="128" y="266" width="220" height="12" rx="6" fill="#C9A227" opacity="0.55"/>
  <rect x="128" y="300" width="96" height="34" rx="10" fill="url(#gold)"/>
  <!-- roof / home mark above the window -->
  <path d="M256 48 L360 116 L152 116 Z" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
  <!-- plinth -->
  <rect x="150" y="392" width="212" height="14" rx="7" fill="url(#gold)"/>
  <rect x="188" y="418" width="136" height="10" rx="5" fill="#C9A227" opacity="0.6"/>
</svg>
